<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Frota</title>
    
    <!-- Importando a biblioteca de Calendário (FullCalendar) -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    
    <style>
        /* Estilos Gerais */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; margin-top: 0;}
        .btn { display: inline-block; padding: 12px 20px; background: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; text-align: center; width: 100%; margin-top: 10px; font-weight: bold; font-size: 16px;}
        .btn:hover { background: #004494; }
        
        /* Navegação tipo Abas (Tabs) */
        .tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 25px; }
        .tab-btn { flex: 1; padding: 12px; cursor: pointer; border: none; background: transparent; font-weight: bold; font-size: 16px; color: #666; transition: 0.2s; outline: none; }
        .tab-btn:hover { color: #0056b3; background: #f8f9fa; }
        .active-tab { color: #0056b3; border-bottom: 3px solid #0056b3; background: #f8f9fa; }
        
        /* Controle de Telas */
        #tela-calendario, #tela-cadastro { display: none; }
        .active-screen { display: block !important; animation: fadeIn 0.4s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Legenda de Cores */
        .legenda-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-bottom: 20px; padding: 15px; background: #f8f9fa; border-radius: 6px; border: 1px solid #eee; }
        .item-legenda { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: bold; color: #333; }
        .cor-box { width: 18px; height: 18px; border-radius: 4px; border: 1px solid rgba(0,0,0,0.1); }
        
        /* Formulário */
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #444; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 15px; }
        input:focus, select:focus { border-color: #0056b3; outline: none; }
        
        #loading { text-align: center; font-weight: bold; color: #666; margin: 20px 0; padding: 20px; background: #fff3cd; border-radius: 5px; border: 1px solid #ffe69c;}

        /* Ajustes do Calendário */
        #calendar { margin-top: 10px; font-size: 14px; }
        .fc .fc-button-primary { background-color: #0056b3; border-color: #0056b3; font-weight: bold; text-transform: capitalize;}
        .fc .fc-button-primary:hover { background-color: #004494; border-color: #004494; }
        .fc .fc-button-primary:disabled { background-color: #6c757d; border-color: #6c757d; }
        .fc-event { cursor: pointer; padding: 3px 5px; font-size: 12px; border: none; border-radius: 3px; margin-bottom: 2px;}
        .fc-toolbar-title { text-transform: capitalize; color: #333; font-size: 1.5em !important; }
    </style>
</head>
<body>

<div class="container">
    <h1>Controle de Frota</h1>
    
    <!-- Navegação em Abas (Tabs) -->
    <div class="tabs">
        <button id="tab-calendario" class="tab-btn active-tab" onclick="mudarTela('calendario')">📅 Calendário de Reservas</button>
        <button id="tab-cadastro" class="tab-btn" onclick="mudarTela('cadastro')">➕ Fazer Nova Reserva</button>
    </div>

    <!-- TELA 1: CALENDÁRIO MENSAL (VISÃO INICIAL) -->
    <div id="tela-calendario" class="active-screen">
        
        <!-- Legenda -->
        <div class="legenda-container" id="container-legenda"></div>

        <button class="btn" style="margin-bottom: 5px; background: #28a745; width: auto; font-size: 14px; padding: 8px 15px;" onclick="carregarAgendamentos()">🔄 Atualizar Status</button>
        
        <div id="loading">Buscando os status dos veículos...</div>
        
        <!-- O Calendário vai aparecer dentro desta div -->
        <div id="calendar"></div>
    </div>

    <!-- TELA 2: FORMULÁRIO DE CADASTRO -->
    <div id="tela-cadastro">
        <h2>Preencha para Reservar</h2>
        <form id="form-agendamento" onsubmit="salvarAgendamento(event)">
            <div class="form-group">
                <label for="carro">Veículo:</label>
                <select id="carro" required></select>
            </div>
            <div class="form-group">
                <label for="nome">Nome do Motorista / Responsável:</label>
                <input type="text" id="nome" required placeholder="Digite o nome de quem vai usar">
            </div>
            <div class="form-group">
                <label for="data">Data de Utilização:</label>
                <input type="date" id="data" required>
            </div>
            <div class="form-group" style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="hora_inicio">Saída (Hora):</label>
                    <input type="time" id="hora_inicio" required>
                </div>
                <div style="flex: 1;">
                    <label for="hora_fim">Retorno (Hora):</label>
                    <input type="time" id="hora_fim" required>
                </div>
            </div>
            <button type="submit" class="btn" id="btn-submit">Confirmar Reserva</button>
        </form>
    </div>
</div>

<script>
    // ==========================================
    // 1. COLE AQUI SUA URL DO GOOGLE APPS SCRIPT
    // ==========================================
    const URL_GOOGLE_SCRIPT = "https://script.google.com/macros/s/AKfycbwYJDwW-FZoV6ZhpKY3sc75zlaEGdQ-qnSscfb2eDmb-qPYzo7WIJHRVg2ndu4gNxMe/exec";

    // ==========================================
    // 2. CONFIGURAÇÃO DE CARROS E SUAS CORES
    // ==========================================
    const configuracaoCarros = {
        "Carro 1": "#0d6efd", // Azul 
        "Carro 2": "#198754", // Verde
        "Carro 3": "#dc3545", // Vermelho
        "Carro 4": "#fd7e14", // Laranja
        "Carro 5": "#6f42c1"  // Roxo
    };

    let calendarioApp; 
    let agendamentosAtuais = []; // Armazena as reservas para verificação de disponibilidade

    window.onload = () => {
        gerarConfiguracoes();
        carregarAgendamentos();
    };

    // Alternar entre Telas
    function mudarTela(tela) {
        const telaCalendario = document.getElementById('tela-calendario');
        const telaCadastro = document.getElementById('tela-cadastro');
        const tabCalendario = document.getElementById('tab-calendario');
        const tabCadastro = document.getElementById('tab-cadastro');

        if (tela === 'calendario') {
            telaCalendario.classList.add('active-screen');
            telaCadastro.classList.remove('active-screen');
            
            tabCalendario.classList.add('active-tab');
            tabCadastro.classList.remove('active-tab');
            
            carregarAgendamentos(); 
            
            if(calendarioApp) {
                setTimeout(() => calendarioApp.updateSize(), 100);
            }
        } else {
            telaCadastro.classList.add('active-screen');
            telaCalendario.classList.remove('active-screen');
            
            tabCadastro.classList.add('active-tab');
            tabCalendario.classList.remove('active-tab');
        }
    }

    // Gera a Legenda de Cores e Opções do Formulário
    function gerarConfiguracoes() {
        const containerLegenda = document.getElementById('container-legenda');
        const selectCarro = document.getElementById('carro');
        
        containerLegenda.innerHTML = '';
        selectCarro.innerHTML = '<option value="">Selecione o veículo...</option>';

        for (const [nomeCarro, cor] of Object.entries(configuracaoCarros)) {
            containerLegenda.innerHTML += `
                <div class="item-legenda">
                    <div class="cor-box" style="background-color: ${cor};"></div>
                    ${nomeCarro}
                </div>
            `;
            selectCarro.innerHTML += `<option value="${nomeCarro}">${nomeCarro}</option>`;
        }
    }

    // Buscar dados da planilha e guardar na memória
    async function carregarAgendamentos() {
        const loading = document.getElementById('loading');
        loading.style.display = 'block';
        loading.innerHTML = "Buscando os status dos veículos na planilha...";

        try {
            if (URL_GOOGLE_SCRIPT === "https://script.google.com/macros/s/AKfycbwYJDwW-FZoV6ZhpKY3sc75zlaEGdQ-qnSscfb2eDmb-qPYzo7WIJHRVg2ndu4gNxMe/exec") {
                loading.innerHTML = "<strong>⚠️ AVISO IMPORTANTE:</strong><br>Você precisa colocar o link do seu Google Apps Script na linha 105 do código.";
                return;
            }

            const response = await fetch(URL_GOOGLE_SCRIPT);
            agendamentosAtuais = await response.json(); // Guarda a lista atual de reservas
            loading.style.display = 'none';

            // Transformar os dados para exibir no calendário
            const eventosFormatados = agendamentosAtuais.map(agendamento => {
                const cor = configuracaoCarros[agendamento.carro] || "#6c757d"; 
                
                const dataInicio = `${agendamento.data}T${agendamento.hora_inicio}:00`;
                const dataFim = `${agendamento.data}T${agendamento.hora_fim}:00`;

                const tituloStatus = `🚗 ${agendamento.carro} | 👤 ${agendamento.nome} (${agendamento.hora_inicio} às ${agendamento.hora_fim})`;

                return {
                    title: tituloStatus,
                    start: dataInicio,
                    end: dataFim,
                    backgroundColor: cor,
                    borderColor: cor,
                    allDay: false
                };
            });

            renderizarCalendario(eventosFormatados);

        } catch (error) {
            loading.innerHTML = "<span style='color:red;'>Erro ao carregar os status. Verifique a internet ou o link do Apps Script.</span>";
            console.error(error);
        }
    }

    // Renderiza o Calendário na Tela
    function renderizarCalendario(eventos) {
        const calendarEl = document.getElementById('calendar');

        if (calendarioApp) {
            calendarioApp.removeAllEvents();
            calendarioApp.addEventSource(eventos);
        } else {
            calendarioApp = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'pt-br', 
                
                customButtons: {
                    btnAnterior: {
                        text: '⬅️ Mês Anterior',
                        click: function() {
                            calendarioApp.prev();
                        }
                    },
                    btnSeguinte: {
                        text: 'Mês Seguinte ➡️',
                        click: function() {
                            calendarioApp.next();
                        }
                    },
                    btnHoje: {
                        text: '📅 Mês Atual',
                        click: function() {
                            calendarioApp.today();
                        }
                    }
                },
                
                headerToolbar: {
                    left: 'btnAnterior,btnSeguinte',
                    center: 'title',
                    right: 'btnHoje'
                },
                
                events: eventos,
                displayEventTime: false,
                contentHeight: 'auto'
            });
            calendarioApp.render();
        }
    }

    // Salvar novo agendamento com VERIFICAÇÃO DE DISPONIBILIDADE
    async function salvarAgendamento(event) {
        event.preventDefault();
        
        const carro = document.getElementById('carro').value;
        const nome = document.getElementById('nome').value;
        const data = document.getElementById('data').value;
        const hora_inicio = document.getElementById('hora_inicio').value;
        const hora_fim = document.getElementById('hora_fim').value;

        // 1. Validação básica: Hora final deve ser após a hora inicial
        if (hora_fim <= hora_inicio) {
            alert('A hora de retorno deve ser posterior à hora de saída.');
            return;
        }

        // 2. Validação de conflito: Verifica se o mesmo carro já possui agendamento no mesmo horário
        const conflito = agendamentosAtuais.some(agendamento => {
            if (agendamento.carro === carro && agendamento.data === data) {
                // Checa sobreposição de horário
                // Existe sobreposição se: (novaSaida < reservaFim) E (novaRetorno > reservaInicio)
                return (hora_inicio < agendamento.hora_fim && hora_fim > agendamento.hora_inicio);
            }
            return false;
        });

        if (conflito) {
            alert('Carro indisponível.');
            return;
        }

        // Se estiver livre, prossegue com o salvamento
        const btnSubmit = document.getElementById('btn-submit');
        btnSubmit.innerText = "Salvando na planilha...";
        btnSubmit.disabled = true;

        const dados = { carro, nome, data, hora_inicio, hora_fim };

        try {
            await fetch(URL_GOOGLE_SCRIPT, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            alert('Reserva concluída e salva na planilha!');
            document.getElementById('form-agendamento').reset();
            
            // Volta para a tela do calendário e atualiza
            mudarTela('calendario');

        } catch (error) {
            alert('Falha ao salvar. Verifique a internet.');
            console.error(error);
        } finally {
            btnSubmit.innerText = "Confirmar Reserva";
            btnSubmit.disabled = false;
        }
    }
</script>
</body>
</html>
